name: Publicar PuntoLocal 0.6.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-0.4.1.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar paquete verificado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e024-820e-823c-d0f039940908/raw?se=2026-11-16T16%3A27%3A11Z&sp=r&sv=2026-06-06&sr=b&scid=6292eb93-145f-408c-bdc5-e3244a995492&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T11%3A49%3A43Z&ske=2026-11-17T11%3A49%3A43Z&sks=b&skv=2026-06-06&sig=BYKhyRIet7zAK6348HRTdndgICaye01003JkbSJ%2Bb1I%3D' -o PuntoLocal-Windows-8-en-adelante-0.6.0.zip
          echo '07134b5e90d1dfa52aad30b57c30be45b5f6a8712feec6efe00ffc04fcdc9a79  PuntoLocal-Windows-8-en-adelante-0.6.0.zip' | sha256sum --check
          unzip -j PuntoLocal-Windows-8-en-adelante-0.6.0.zip 'PuntoLocal Setup 0.6.0 Windows 8+.exe'

      - name: Publicar clientes y compras
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.0 'PuntoLocal-Windows-8-en-adelante-0.6.0.zip' 'PuntoLocal Setup 0.6.0 Windows 8+.exe' --repo cristiancanepa5-cloud/PuntoLocal-Updates --title 'PuntoLocal 0.6.0 — clientes y compras' --notes 'Agrega gestión de clientes, asociación de clientes a ventas, compras e ingreso automático de mercadería, actualización del costo y trazabilidad de proveedor, factura y usuario.'
