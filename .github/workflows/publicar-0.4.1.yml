name: Publicar PuntoLocal 0.5.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-0.4.1.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar paquete verificado
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-26c0-820e-9eee-f9369a69887e/raw?se=2026-11-16T15%3A53%3A57Z&sp=r&sv=2026-06-06&sr=b&scid=c8b8a5f1-58fa-4e9d-8666-301392688691&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T10%3A41%3A44Z&ske=2026-11-17T10%3A41%3A44Z&sks=b&skv=2026-06-06&sig=8cjbssk2hGS66iL0FNor0QI52mixJ34DwPlhmq0r768%3D' -o PuntoLocal-Windows-8-en-adelante-0.5.0.zip
          echo '7a153141a47320fae18f30e9ff4cfc0aefa4c34f24967c7cbde94c68190a3174  PuntoLocal-Windows-8-en-adelante-0.5.0.zip' | sha256sum --check
          unzip -j PuntoLocal-Windows-8-en-adelante-0.5.0.zip 'PuntoLocal Setup 0.5.0 Windows 8+.exe'

      - name: Publicar actualización automática e instalador directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.0 'PuntoLocal-Windows-8-en-adelante-0.5.0.zip' 'PuntoLocal Setup 0.5.0 Windows 8+.exe' --repo cristiancanepa5-cloud/PuntoLocal-Updates --title 'PuntoLocal 0.5.0 — controles y acciones' --notes 'Actualización funcional: botones y elementos seleccionables corregidos, edición de productos, filtros y detalle de ventas, avisos, informes y accesos rápidos. Compatible con Windows 8 en adelante, 32 y 64 bits.'
