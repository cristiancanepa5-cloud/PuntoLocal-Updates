name: Publicar instalador directo 0.4.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-0.4.1.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar paquete público verificado
        run: |
          curl -L --fail --retry 3 'https://github.com/cristiancanepa5-cloud/PuntoLocal-Updates/releases/download/v0.4.1/PuntoLocal-Windows-8-en-adelante-0.4.1.zip' -o PuntoLocal-Windows-8-en-adelante-0.4.1.zip
          echo 'a05f9a74439d4032b8412b516d5483b86ce959cb302ccdac52a0474f213302be  PuntoLocal-Windows-8-en-adelante-0.4.1.zip' | sha256sum --check
          unzip -j PuntoLocal-Windows-8-en-adelante-0.4.1.zip 'PuntoLocal Setup 0.4.1 Windows 8+.exe'

      - name: Agregar instalador EXE a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.1 'PuntoLocal Setup 0.4.1 Windows 8+.exe' --repo cristiancanepa5-cloud/PuntoLocal-Updates --clobber
