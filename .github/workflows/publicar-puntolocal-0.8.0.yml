name: Publicar PuntoLocal 0.8.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-puntolocal-0.8.0.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preparar repositorio de actualizaciones
        uses: actions/checkout@v4
        with:
          path: updates

      - name: Descargar código privado de PuntoLocal
        uses: actions/checkout@v4
        with:
          repository: cristiancanepa5-cloud/PuntoLocal
          ref: 12ee09488d8496f8c3fc95ed6b836d6de8064400
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Instalar dependencias
        working-directory: source
        run: npm ci

      - name: Verificar compatibilidad con Windows 8
        working-directory: source
        run: node -e "const v=require('./node_modules/electron/package.json').version; console.log('Electron '+v); if(v!=='22.3.27') process.exit(1)"

      - name: Configurar servidor de actualizaciones
        working-directory: source
        shell: pwsh
        env:
          PUNTOLOCAL_UPDATE_API_URL: https://api.github.com/repos/cristiancanepa5-cloud/PuntoLocal-Updates/releases/latest
        run: node scripts/configure-updates.mjs

      - name: Compilar interfaz
        working-directory: source
        run: npm run build

      - name: Crear instalador de 32 y 64 bits
        working-directory: source
        run: npx electron-builder --win nsis --x64 --ia32 --publish never

      - name: Preparar nombres compatibles con GitHub
        shell: pwsh
        run: |
          $exe = Get-ChildItem "source/release/*.exe" | Select-Object -First 1
          $block = Get-ChildItem "source/release/*.exe.blockmap" | Select-Object -First 1
          if (-not $exe -or -not $block -or -not (Test-Path "source/release/latest.yml")) {
            throw "Faltan archivos del instalador o de actualización"
          }
          $oldExe = $exe.Name
          $oldBlock = $block.Name
          $newExe = "PuntoLocal.Setup.0.8.0.Windows.8+.exe"
          $newBlock = "$newExe.blockmap"
          Rename-Item -LiteralPath $exe.FullName -NewName $newExe
          Rename-Item -LiteralPath $block.FullName -NewName $newBlock
          $manifestPath = (Resolve-Path "source/release/latest.yml").Path
          $manifest = Get-Content $manifestPath -Raw
          $manifest = $manifest.Replace($oldExe, $newExe).Replace($oldBlock, $newBlock)
          [System.IO.File]::WriteAllText($manifestPath, $manifest, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $manifestPath

      - name: Publicar versión 0.8.0
        uses: softprops/action-gh-release@v2
        with:
          repository: cristiancanepa5-cloud/PuntoLocal-Updates
          tag_name: v0.8.0
          target_commitish: main
          name: PuntoLocal 0.8.0 — planes, caja y auditoría
          body: |
            ## Novedades

            - Planes Básico y Premium aplicados dentro de la aplicación.
            - Apertura, arqueo y cierre de caja con historial de diferencias.
            - Panel con ventas reales del día y de los últimos 7 días.
            - Productos por categorías y carga/venta mediante código de barras.
            - Reportes de rentabilidad para el plan Premium.
            - Centro fiscal ARCA preparado para el plan Premium.
            - Auditoría de ventas, stock, compras, caja, clientes, usuarios y sucursales.
            - Licencias mensuales con renovación y verificación remota.
            - Mensajería de soporte y administración del servicio.
            - Compatible con Windows 8, 8.1, 10 y 11, en 32 y 64 bits.

            La actualización conserva los datos existentes.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            source/release/PuntoLocal.Setup.0.8.0.Windows.8+.exe
            source/release/PuntoLocal.Setup.0.8.0.Windows.8+.exe.blockmap
            source/release/latest.yml

      - name: Actualizar referencia pública
        shell: pwsh
        run: |
          $exePath = "source/release/PuntoLocal.Setup.0.8.0.Windows.8+.exe"
          $digest = (Get-FileHash -Algorithm SHA256 $exePath).Hash.ToLower()
          $published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $info = [ordered]@{
            tag_name = "v0.8.0"
            name = "PuntoLocal 0.8.0 — planes, caja y auditoría"
            published_at = $published
            assets = @(
              [ordered]@{
                name = "PuntoLocal.Setup.0.8.0.Windows.8+.exe"
                browser_download_url = "https://github.com/cristiancanepa5-cloud/PuntoLocal-Updates/releases/download/v0.8.0/PuntoLocal.Setup.0.8.0.Windows.8%2B.exe"
                digest = "sha256:$digest"
              }
            )
          }
          $json = $info | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "updates").Path "latest.json"), $json + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          Set-Location updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Actualizar referencia a PuntoLocal 0.8.0"
          git push
